# Frontend — Static Assets Only
#
# API proxying is handled by the API Gateway (gateway service).
# This server only serves the built React SPA and static files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all non-file routes.
    #
    # Cache-Control contract (frontend.md §5 hard rule / P2 tail):
    # index.html is the single entry point that loads every hashed asset
    # bundle. If an intermediate cache (browser, corporate proxy, CDN edge)
    # holds on to an older copy, it will keep pointing at bundle hashes
    # that have since been replaced or removed on deploy — the user sees
    # a white screen or 404 on /assets/index-<old-hash>.js until the cache
    # expires. `no-store` forbids both shared and private caches from
    # persisting the response at all, guaranteeing the next navigation
    # picks up the freshly deployed index and its current asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. File names are content-hashed by the Vite build
    # (`assets/index-<hash>.{js,css}`) so `immutable` is safe: a content
    # change produces a new URL, which is why `index.html` — the only
    # mutable URL in the tree — opts out above.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
