spring.datasource.url=jdbc:mysql://localhost:3306/pixels_auth
# mysql username
spring.datasource.username=pixels
# mysql password
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Flyway (application-table SSOT for pixels_auth; see docs/development/backend.md §12.2).
# - enabled=true: Spring Boot's FlywayAutoConfiguration runs `migrate` on startup.
# - locations stays at the default (classpath:db/migration) so V<n>__*.sql are picked up
#   from src/main/resources/db/migration/.
# - baseline-on-migrate=true + baseline-version=0: if auth-service ever starts against
#   a pre-existing database that has tables but no flyway_schema_history (historical
#   migrations from the initdb.d era), Flyway will adopt the existing state as baseline
#   and then apply V1+ normally. V1 uses CREATE TABLE IF NOT EXISTS to stay idempotent
#   in that scenario.
# - schemas is intentionally NOT set. Flyway must NOT create logical databases; that
#   ownership belongs to db/pixels_rover.sql via MySQL initdb.d (backend.md §12.1).
# - Hibernate ddl-auto stays at the Spring Boot default (none for non-embedded DBs);
#   setting it to anything else would re-introduce the "create_all drift" path that
#   B1+B2 explicitly forbids.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=none
# captcha type
user.captchaType=math
# prevent xss attack
xss.enabled=true
# exclude links (separate with comma)
xss.excludes=
# match links
xss.urlPatterns=/system/*
# internationalization resource file path
spring.messages.basename=i18n/messages
# disable open session in view
spring.jpa.open-in-view=false
# spring boot devtools livereload port
spring.devtools.livereload.port=35730
# pixels_auth port
server.port=8081
# OpenAPI / springdoc: expose at /openapi.json (gateway.md §6.7 +
# backend.md §9 hardcode this path for every service; the gateway's
# /api/v1/auth/openapi.json route strips the /api/v1/auth/ prefix and
# proxies to this path). swagger-ui is NOT enabled — we ship the
# starter-webmvc-api artifact only, see pom.xml.
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.enabled=true
# JWT configuration.
# §14 / backend.md §13.1: NO defaults for any security-sensitive fields.
# RequiredEnvValidator (io.pixelsdb.pixels.rover.bootstrap) consumes
# config/required-env.yaml's services.auth-service block at startup and
# fails the boot with a FATAL line if anything is missing / malformed.
# Non-sensitive knobs (issuer, expiration windows, pem-literal slots)
# keep their inline defaults because they either derive from service
# identity or are write-once after first boot.
# jwt.algorithm intentionally allows empty fallback so @SpringBootTest /
# @WebMvcTest contexts (which don't activate the validator) still load.
# Production correctness is guarded by RequiredEnvValidator.
jwt.algorithm=${JWT_ALGORITHM:}
jwt.active-kid=${JWT_ACTIVE_KID:}
jwt.secret=${JWT_SECRET:}
jwt.private-key-pem=
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
jwt.public-key-pem=
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
# Directory enumerated for rotation verification keys; auth-service reads every
# <kid>-public.pem file here (see docs/design/jwt-rotation.md §1.2). Empty means
# only the active key PEM above is loaded.
jwt.public-keys-directory=${JWT_PUBLIC_KEYS_DIRECTORY:}
jwt.issuer=pixels-rover-auth-service
# access token expiration: 1 hour (in milliseconds)
jwt.access-token-expiration-ms=3600000
# refresh token expiration: 7 days (in milliseconds)
jwt.refresh-token-expiration-ms=604800000
# Cookie configuration (dev defaults; override in prod profile)
# Set to true in production with HTTPS
cookie.secure=${COOKIE_SECURE:false}
# SameSite policy: Lax for dev/prod (compatible with external links)
cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Leave empty for localhost; set to your domain in production
cookie.domain=${COOKIE_DOMAIN:}
# Shared secret for gateway -> auth-service internal introspection.
# No default: absence / placeholder values ("change-me" etc.) are
# rejected by RequiredEnvValidator — see config/required-env.yaml.
internal.introspection.secret=${INTERNAL_INTROSPECTION_SECRET:}
# Required-env SSOT bind-mount path (§14). Validator reads this file
# at startup. Kept as a property so tests can override it; container
# path is set via RequiredEnvValidator's application.properties path
# consumer.
app.required-env.path=${ROVER_REQUIRED_ENV_PATH:/app/config/required-env.yaml}
