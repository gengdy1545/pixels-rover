# Alembic configuration for assistant-service.
#
# Scope (see docs/development/backend.md §12.2):
#   * Alembic is the SSOT for application tables under the `pixels_analysis`
#     logical database. The logical database itself is created by
#     db/pixels_rover.sql via MySQL initdb.d (backend.md §12.1); this
#     configuration assumes the database already exists.
#   * `alembic upgrade head` is run synchronously by the container entrypoint
#     BEFORE uvicorn starts listening. Failure exits the process (1). See
#     services/assistant-service/Dockerfile.
#   * Do NOT put lifespan-triggered `alembic.command.upgrade()` calls inside
#     the FastAPI app — by the time lifespan runs, uvicorn has already bound
#     to the port, so half-ready requests would hit the server. Entrypoint
#     ordering is the only correct placement.
#
# DB URL resolution (see alembic/env.py):
#   * Reads ROVER_DATABASE_URL (same env var as the app runtime). If the URL
#     uses the aiomysql driver (mysql+aiomysql://), env.py rewrites it to
#     mysql+pymysql:// for Alembic's synchronous migration context.

[alembic]
script_location = alembic

# File template for generated migration filenames:
#   <timestamp>_<slug>_<rev>.py → sortable + human-readable
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s_%%(rev)s

# Timezone used for timestamps in filenames (UTC; stable across contributors).
timezone = UTC

# sqlalchemy.url is intentionally left blank — env.py resolves the URL from
# ROVER_DATABASE_URL so that local, CI, and container deploys all use the same
# source of truth. DO NOT hard-code a URL here; doing so would create drift
# between migration runs and runtime config.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks — keep generated migration files byte-stable so code
# review can rely on diff alone.

# Logging configuration (quiet by default; set ALEMBIC_LOGLEVEL=INFO to verbose).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
