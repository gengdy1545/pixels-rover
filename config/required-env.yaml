# Pixels Rover — required environment variables (SSOT).
#
# Single source of truth for every "if this env var is missing / malformed
# the system is silently broken" declaration across the entrypoint-validated
# services plus Ory deployment secrets. Five consumers read this file:
#
#   1. scripts/generate-env-example.py              — renders .env.example
#   2. gateway/validate-required-env.py             — gateway entrypoint
#   3. docker-compose.yml                           — Ory required-env guard
#   4. services/assistant-service/app/required_env.py
#   5. scripts/smoke.sh                             — cold-boot pre-flight (future PR)
#
# scripts/check-contracts.py enforces all five actually reference this
# path (`required-env-yaml-consumers-registered`) AND that every entry
# conforms to config/required-env.schema.yaml
# (`required-env-yaml-conforms-to-schema`) AND that .env.example is a
# byte-identical re-render of this file (`env-example-matches-required-env-yaml`).
#
# ----------------------------------------------------------------------
# DSL reference (see config/required-env.schema.yaml for the formal schema):
#
#   name:                 (required) env var name, UPPER_SNAKE_CASE
#   description:          (required) one-sentence human-readable purpose
#   required:             (optional, default false) always-required
#   required_when:        (optional) "OTHER_VAR=value" — required iff other var equals value
#   forbidden_when:       (optional) "OTHER_VAR=value" — MUST be empty iff other var equals value
#                         (together with required_when, encodes mutually exclusive groups)
#   enum:                 (optional) list of exact allowed values (string compare)
#   forbidden_values:     (optional) list of values that must NEVER appear (placeholders, "change-me", "*")
#   min_utf8_bytes:       (optional) minimum length of the value as UTF-8 bytes
#   file_must_exist:      (optional) value is a path; file must exist AND be readable at validator run time
#   env_example:          (optional) value to render in .env.example; if omitted the var is emitted as `KEY=` with a commented-out placeholder above it
#   sensitive:            (optional, default false) if true, generator emits `KEY=` (no value); operator MUST supply before boot
#
# Hard rules:
#   * Every entry MUST carry either `required: true` OR `required_when:`
#     (never both). Pure-optional vars have no place here.
#   * `required_when` and `forbidden_when` MUST reference a var declared
#     earlier in the same service block (declaration order = dependency order).
#   * `forbidden_values` always includes the empty string implicitly —
#     do NOT list "" explicitly. Placeholders like "change-me",
#     "<set-me>", "sk-your-api-key-here" MUST be listed.
# ----------------------------------------------------------------------

services:

  # -------------------------------------------------------------------
  # gateway — APISIX Standalone YAML. Entrypoint validator
  # (gateway/validate-required-env.py) runs BEFORE template render /
  # envsubst, so missing vars produce a single FATAL log line with zero
  # upstream side-effects.
  # -------------------------------------------------------------------
  gateway:
    - name: CORS_ALLOWED_ORIGINS
      description: >-
        Comma-separated list of allowed origins for CORS pre-flight
        responses. APISIX renders this value into its cors plugin. "*" is
        forbidden in production; use docker-compose.dev.yml for local
        defaults.
      required: true
      forbidden_values: ["*"]

    - name: GATEWAY_CSP_PROFILE
      description: >-
        Content-Security-Policy profile selector. "production" emits the
        strict CSP (no unsafe-inline, no unsafe-eval); "development"
        emits the looser CSP allowing Vite's HMR websocket. Empty / any
        other value is a fatal boot error — gateway.md §6.6 forbids a
        default so every deployment makes an explicit choice.
      required: true
      enum: [production, development]

  # -------------------------------------------------------------------
  # ory-deployment — shared deployment settings for Kratos / Ory UI.
  # docker-compose.yml validates this block through the required-env guard
  # before any Ory component starts. Local development gets safe defaults
  # from docker-compose.dev.yml; production must set explicit values.
  # -------------------------------------------------------------------
  ory-deployment:
    - name: PUBLIC_BASE_URL
      description: >-
        External browser-facing base URL for Kratos browser flows and Ory UI
        redirects, for example https://rover.example.com. Production must
        set the real HTTPS origin; docker-compose.dev.yml supplies
        http://localhost for local development only.
      required: true
      forbidden_values: ["change-me", "<set-me>"]

  # -------------------------------------------------------------------
  # kratos — Ory Kratos identity/session authority. Ory reads these
  # directly from docker-compose.yml; docker-compose.yml validates this
  # block through the required-env guard before Kratos starts.
  # -------------------------------------------------------------------
  kratos:
    - name: KRATOS_SECRET_DEFAULT
      description: >-
        Ory Kratos default cryptographic secret. Rotate with care because
        changing it can invalidate encrypted/signature-protected state.
      required: true
      forbidden_values: ["change-me", "<set-me>"]
      min_utf8_bytes: 32
      sensitive: true

    - name: KRATOS_SECRET_COOKIE
      description: >-
        Ory Kratos cookie signing/encryption secret for browser sessions.
      required: true
      forbidden_values: ["change-me", "<set-me>"]
      min_utf8_bytes: 32
      sensitive: true

  # -------------------------------------------------------------------
  # ory-ui — Ory Kratos reference self-service UI.
  # -------------------------------------------------------------------
  ory-ui:
    - name: ORY_UI_COOKIE_SECRET
      description: >-
        Cookie and CSRF secret for the Ory self-service UI container.
        Must be deployment-local and must not be committed.
      required: true
      forbidden_values: ["change-me", "<set-me>"]
      min_utf8_bytes: 32
      sensitive: true

  # -------------------------------------------------------------------
  # assistant-service — Python / FastAPI. Validator
  # (app.required_env.validate_or_die) runs from app.main before
  # FastAPI's ASGI app is returned, so boot fails cleanly without ever
  # binding :8090.
  # -------------------------------------------------------------------
  assistant-service:
    - name: ROVER_LLM_API_KEY
      description: >-
        API key for the configured LLM provider (OpenAI-compatible).
        Empty or placeholder values disable analysis outright; we fail
        fast rather than serving 500s on the first /analysis submit.
      required: true
      forbidden_values: ["sk-your-api-key-here", "<set-me>"]
      sensitive: true

    - name: ROVER_DATABASE_URL
      description: >-
        SQLAlchemy async URL for pixels_analysis. Alembic upgrade head
        runs against this URL from entrypoint.sh before uvicorn binds
        the port (backend.md §12.2); a missing URL would leave the
        service in a half-migrated state invisible from /internal/ready.
      required: true

    # -- architecture-tasks §Task 8 — subject-integrity JWT verifier ----
    # Four variables together wire the backend's Oathkeeper id_token
    # verifier. All four are declared `required: true` so a deployment
    # that forgets any single one fails to boot (rather than silently
    # falling back to the plaintext X-Auth-* trust model). Test
    # harnesses bypass the whole verifier by setting
    # `OATHKEEPER_JWT_REQUIRED=false` AND `ROVER_REQUIRED_ENV_SKIP=1`,
    # which keeps the production defaults uncompromised.

    - name: OATHKEEPER_JWKS_URL
      description: >-
        URL of Oathkeeper's JWKS endpoint, e.g.
        http://oathkeeper:4456/.well-known/jwks.json. The backend
        fetches the signing keys from here (with short TTL cache) to
        verify the Bearer JWT that Oathkeeper's id_token mutator
        injects. MUST be reachable from the assistant-service
        container; compose's internal DNS makes this a stable host
        without exposing the port externally (architecture-tasks
        §Task 8).
      required: true
      env_example: "http://oathkeeper:4456/.well-known/jwks.json"

    - name: OATHKEEPER_JWT_ISSUER
      description: >-
        Expected `iss` claim on the Oathkeeper-issued JWT. Must match
        Oathkeeper's id_token mutator `issuer_url` setting in
        config/ory/oathkeeper/oathkeeper.yml. Decoupling the expected
        value here (instead of hardcoding in app code) lets staging
        vs production run with different issuer strings without a
        code change.
      required: true
      env_example: "https://pixels-rover.local/oathkeeper"

    - name: OATHKEEPER_JWT_AUDIENCE
      description: >-
        Expected `aud` claim on the Oathkeeper-issued JWT. Pins the
        JWT to the assistant-service audience so a token leaked from
        a hypothetical future sibling backend cannot be replayed
        against this one. Must match Oathkeeper's id_token mutator
        `audience` list.
      required: true
      env_example: "pixels-rover-assistant"

    - name: OATHKEEPER_JWT_REQUIRED
      description: >-
        Master switch for the Task 8 verifier. "true" in every
        non-test runtime (production, staging, dev-compose) — the
        backend rejects requests without a valid Oathkeeper JWT with
        401 GATEWAY_SUBJECT_UNVERIFIED. "false" is reserved for
        pytest / unit-test harnesses that bypass the JWT layer
        entirely via ROVER_REQUIRED_ENV_SKIP=1; never ship "false"
        in a real deployment.
      required: true
      enum: ["true", "false"]
      env_example: "true"
