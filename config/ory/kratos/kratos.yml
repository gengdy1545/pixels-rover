version: v1.3.0

serve:
  public:
    cors:
      enabled: true
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
        - X-CSRF-Token
        - X-Request-Id
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  methods:
    password:
      enabled: true

  flows:
    login:
      lifespan: 10m
    registration:
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
    settings:
      privileged_session_max_age: 15m
    recovery:
      enabled: false
    verification:
      enabled: false

session:
  cookie:
    name: ory_kratos_session
    same_site: Lax
    path: /
  lifespan: 720h
  whoami:
    required_aal: aal1

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

log:
  level: info
  format: text
  leak_sensitive_values: false
