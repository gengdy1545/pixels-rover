- id: assistant-analysis
  upstream:
    url: http://assistant-service:8090
  match:
    url: http://<.*>/api/v1/analysis<.*>
    methods:
      - GET
      - POST
      - OPTIONS
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  errors:
    - handler: json

- id: assistant-conversations
  upstream:
    url: http://assistant-service:8090
  match:
    url: http://<.*>/api/v1/conversations<.*>
    methods:
      - GET
      - POST
      - PATCH
      - DELETE
      - OPTIONS
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  errors:
    - handler: json

- id: assistant-semantic
  upstream:
    url: http://assistant-service:8090
  match:
    url: http://<.*>/api/v1/semantic<.*>
    methods:
      - GET
      - POST
      - OPTIONS
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  errors:
    - handler: json
