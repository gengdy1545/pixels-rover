# ============================================================
# Pixels Rover — API Gateway (Nginx + NJS)
#
# Unified entry point for all services:
#   - Frontend static assets (via frontend service)
#   - Auth API      (/api/v1/auth/*)      → auth-service:8081
#   - Chat API      (/api/v1/chat/*)      → auth-service:8081 (short-term; migrate to analysis-service later)
#   - Metadata API  (/api/v1/metadata/*)  → pixels-server (direct proxy)
#   - Query API     (/api/v1/query/*)     → pixels-server (direct proxy)
#   - Text-to-SQL   (/api/v1/query/text-to-sql) → text2sql service (direct proxy)
#   - Analysis API  (/api/*)              → analysis-service:8090
#
# Features:
#   - Unified JWT authentication passthrough via auth_request
#   - HttpOnly Cookie management (write/clear) via NJS
#   - CSRF double-submit token generation and verification
#   - Rate limiting (per-IP)
#   - CORS handling at the gateway level
#   - Audit logging with structured access log
# ============================================================

# Load NJS module for cookie handling
load_module modules/ngx_http_js_module.so;

# --- Rate limiting zones ---
# General API: 10 requests/second per IP, burst up to 20
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
# Auth endpoints (login/register): stricter, 5 requests/second
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
# Analysis endpoint: 2 requests/second (expensive LLM calls)
limit_req_zone $binary_remote_addr zone=api_analysis:10m rate=2r/s;

# --- NJS import ---
js_import cookie_handler from /etc/nginx/njs/cookie_handler.js;

# --- Audit log format ---
log_format audit escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"request_id":"$request_id",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"auth_user_id":"$upstream_http_x_auth_user_id",'
        '"auth_user_email":"$upstream_http_x_auth_user_email"'
    '}';

# --- CSRF verification via NJS ---
js_set $csrf_valid cookie_handler.verifyCsrf;

server {
    listen 80;
    server_name _;

    # Use nginx built-in $request_id for distributed tracing
    # Prefer client-supplied X-Request-Id if present
    set $req_id $http_x_request_id;
    if ($req_id = '') {
        set $req_id $request_id;
    }

    # --- Cookie configuration (from environment variables) ---
    set $cookie_secure "${COOKIE_SECURE}";
    set $cookie_samesite "${COOKIE_SAMESITE}";
    set $cookie_domain "${COOKIE_DOMAIN}";
    set $access_token_max_age "${ACCESS_TOKEN_MAX_AGE}";
    set $refresh_token_max_age "${REFRESH_TOKEN_MAX_AGE}";

    # --- Pixels Server / Text2SQL upstream addresses (from environment variables) ---
    set $pixels_server_upstream "${PIXELS_SERVER_UPSTREAM}";
    set $text2sql_upstream "${TEXT2SQL_UPSTREAM}";

    # Audit log
    access_log /var/log/nginx/audit.log audit;
    error_log  /var/log/nginx/error.log warn;

    # --- CORS configuration (handled at gateway level) ---
    # Origin is validated against the CORS_ALLOWED_ORIGINS whitelist via NJS
    js_set $cors_origin cookie_handler.validateOrigin;

    # ============================================================
    # Internal auth verification endpoint
    # ============================================================
    location = /_auth_verify {
        internal;
        proxy_pass http://auth-service:8081/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Request-Id $req_id;
        # Forward cookies and auth header for JWT verification
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
        # Cache auth results briefly to avoid hammering auth-service
        proxy_cache_valid 200 5s;
    }

    # ============================================================
    # Auth Service — login endpoint (cookie injection via NJS)
    # ============================================================
    location = /api/v1/auth/login {
        # Rate limit auth endpoints
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # NJS body filter to inject token cookies from JSON response
        js_body_filter cookie_handler.injectTokenCookies;
        # Variable to accumulate response body chunks
        set $response_body '';

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
    }

    # ============================================================
    # Auth Service — refresh endpoint (cookie injection via NJS)
    # ============================================================
    location = /api/v1/auth/refresh {
        # Rate limit auth endpoints
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # NJS body filter to inject token cookies from JSON response
        js_body_filter cookie_handler.injectTokenCookies;
        # Variable to accumulate response body chunks
        set $response_body '';

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
    }

    # ============================================================
    # Auth Service — logout endpoint (cookie clearing via NJS)
    # ============================================================
    location = /api/v1/auth/logout {
        # JWT authentication passthrough
        auth_request /_auth_verify;

        # Rate limit auth endpoints
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # NJS header filter to clear token cookies
        js_header_filter cookie_handler.clearTokenCookies;

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # ============================================================
    # Auth Service — logout-all endpoint (cookie clearing via NJS)
    # ============================================================
    location = /api/v1/auth/logout-all {
        # JWT authentication passthrough
        auth_request /_auth_verify;

        # Rate limit auth endpoints
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # NJS header filter to clear token cookies
        js_header_filter cookie_handler.clearTokenCookies;

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # ============================================================
    # Auth Service — other public endpoints (no cookie handling)
    # ============================================================
    location /api/v1/auth/ {
        # Rate limit auth endpoints
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # ============================================================
    # Chat History API — routed to auth-service (short-term)
    # TODO: Migrate ChatHistoryController to analysis-service
    #       when MySQL data migration is complete (see todolist 5.4)
    # ============================================================
    location /api/v1/chat/ {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit general API
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        # Pass authenticated user info downstream
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-User-Email $auth_user_email;
    }

    # ============================================================
    # Text-to-SQL API — direct proxy to text2sql service
    # (must be before /api/v1/query/ to match more specific path first)
    # ============================================================
    location = /api/v1/query/text-to-sql {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit general API
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        proxy_pass $text2sql_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Content-Type application/json;
    }

    # ============================================================
    # Query API — direct proxy to Pixels Server
    # ============================================================
    location /api/v1/query/ {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit general API
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # Rewrite /api/v1/query/* → /api/query/* for Pixels Server
        rewrite ^/api/v1/query/(.*)$ /api/query/$1 break;

        proxy_pass $pixels_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Content-Type application/json;
    }

    # ============================================================
    # Metadata API — direct proxy to Pixels Server
    # ============================================================
    location /api/v1/metadata/ {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit general API
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        # Rewrite /api/v1/metadata/* → /api/metadata/* for Pixels Server
        rewrite ^/api/v1/metadata/(.*)$ /api/metadata/$1 break;

        proxy_pass $pixels_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header Content-Type application/json;
    }

    # ============================================================
    # Analysis Service — SSE endpoint (requires auth + CSRF)
    # ============================================================
    location /api/v1/analysis {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit analysis (expensive LLM calls)
        limit_req zone=api_analysis burst=5 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        proxy_pass http://analysis-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        # Pass authenticated user info downstream
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-User-Email $auth_user_email;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ============================================================
    # Analysis Service — other API endpoints (requires auth + CSRF)
    # ============================================================
    location /api/ {
        # CSRF verification (double-submit pattern)
        if ($csrf_valid = '0') {
            return 403 '{"code":403,"message":"CSRF token validation failed","errorCode":"CSRF_INVALID"}';
        }

        # JWT authentication passthrough
        auth_request /_auth_verify;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_user_email $upstream_http_x_auth_user_email;

        # Rate limit general API
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        # CORS headers
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/cors.conf;

        proxy_pass http://analysis-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        # Pass authenticated user info downstream
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-User-Email $auth_user_email;

        # SSE support (for any future SSE endpoints)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ============================================================
    # Frontend static assets
    # ============================================================
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Health check for the gateway itself
    # ============================================================
    location = /gateway/health {
        access_log off;
        return 200 '{"status":"UP","service":"gateway"}';
        add_header Content-Type application/json;
    }

    # ============================================================
    # Custom error pages for rate limiting
    # ============================================================
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"code":429,"message":"Too many requests, please try again later","errorCode":"RATE_LIMITED"}';
    }

    # Custom error page for auth failures from auth_request
    error_page 401 @unauthorized;
    location @unauthorized {
        default_type application/json;
        return 401 '{"code":401,"message":"Unauthorized, please login","errorCode":"AUTHENTICATION_REQUIRED"}';
    }

    # Custom error page for CSRF failures
    error_page 403 @forbidden;
    location @forbidden {
        default_type application/json;
        return 403 '{"code":403,"message":"Forbidden","errorCode":"ACCESS_DENIED"}';
    }
}
