# APISIX Standalone YAML — single source of truth for gateway routing.
#
# Scope (see docs/development/gateway.md §1):
#   * deployment.role = data_plane + config_provider = yaml in
#     config.yaml.template. This file is the only place where routes,
#     upstreams, and global_rules are declared.
#   * Secrets referenced as ${VAR_NAME} are substituted by
#     entrypoint.sh at container start via envsubst. The rendered file
#     lives at /usr/local/apisix/conf/apisix.yaml.
#   * Any change to routing / auth / CORS / CSP must go through this
#     file + PR diff. There is NO Admin API, NO etcd, NO bootstrap.sh.
#   * Route priorities follow gateway.md §6.2 (deeper prefix beats
#     shallower by >= 10; frontend /* stays at priority 1).
#
# Change-control (hard rules):
#   * Adding a new backend service requires simultaneous edits to
#     (a) this file: new upstream + per-domain routes + gateway-ready
#         plugin `probes[]`;
#     (b) config.yaml.template: new /__ready_probe/<service> internal
#         location with timeouts mirroring `probes[i].timeout_ms`;
#     (c) docker-compose.yml: new service definition.
#     See gateway.md §7 for the checklist.
#   * Secrets are ${VAR} placeholders ONLY. Never commit rendered
#     values. entrypoint.sh fails fast on missing env vars.

routes:
  # ------------------------------------------------------------------
  # Gateway liveness (pure local, no upstream touch).
  # Used by Docker HEALTHCHECK and K8s livenessProbe. Failure -> restart.
  # See gateway.md §4.1.
  # ------------------------------------------------------------------
  - id: gateway-live
    uri: /gateway/live
    methods: [GET]
    priority: 9999
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              ngx.header.content_type = "application/json"
              ngx.status = 200
              ngx.say('{"status":"UP","service":"gateway","version":"3.9.1"}')
              return ngx.exit(200)
            end
    upstream:
      # Placeholder; the serverless function short-circuits in rewrite phase
      # so this upstream is never dialed. We still need a declaration because
      # APISIX Standalone YAML schema requires either upstream or upstream_id.
      type: roundrobin
      nodes:
        "127.0.0.1:65535": 1

  # ------------------------------------------------------------------
  # Gateway readiness (system-level aggregation). Probes each upstream's
  # /internal/ready via nginx internal locations. See gateway.md §4.1
  # and backend.md §7.2. Failure here MUST NOT trigger container restart.
  # ------------------------------------------------------------------
  - id: gateway-ready
    uri: /gateway/ready
    methods: [GET]
    priority: 9998
    plugins:
      gateway-ready:
        probes:
          - name: auth-service
            uri: /__ready_probe/auth
            timeout_ms: 1000
          - name: assistant-service
            uri: /__ready_probe/assistant
            timeout_ms: 1000
        total_timeout_ms: 2000
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:65535": 1

  # ------------------------------------------------------------------
  # Auth-service — public routes (no login required)
  # ------------------------------------------------------------------
  - id: auth-login
    name: auth-login
    uri: /api/v1/auth/login
    methods: [POST, OPTIONS]
    priority: 950
    plugins:
      gateway-auth:
        require_auth: false
        csrf_protect: false
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: auth-service

  - id: auth-register
    name: auth-register
    uri: /api/v1/auth/register
    methods: [POST, OPTIONS]
    priority: 950
    plugins:
      gateway-auth:
        require_auth: false
        csrf_protect: false
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: auth-service

  - id: auth-captcha
    name: auth-captcha
    uri: /api/v1/auth/captcha
    methods: [GET, OPTIONS]
    priority: 950
    plugins:
      gateway-auth:
        require_auth: false
        csrf_protect: false
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: auth-service

  # Refresh is public (must work with expired access_token) but MUST
  # enforce CSRF — see gateway.md §5.2.2 for the three-fold rationale.
  - id: auth-refresh
    name: auth-refresh
    uri: /api/v1/auth/refresh
    methods: [POST, OPTIONS]
    priority: 940
    plugins:
      gateway-auth:
        require_auth: false
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: auth-service

  # ------------------------------------------------------------------
  # Auth-service — protected routes (catch-all, lower priority than
  # the explicit public routes above)
  # ------------------------------------------------------------------
  - id: auth-protected
    name: auth-protected
    uri: /api/v1/auth/*
    priority: 900
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: auth-service

  # ------------------------------------------------------------------
  # Assistant-service — analysis backends (more specific than
  # /api/v1/analysis*; MUST stay at higher priority — see §6.2).
  # ------------------------------------------------------------------
  - id: analysis-backends-root
    name: analysis-backends-root
    uri: /api/v1/analysis/backends
    methods: [GET, OPTIONS]
    priority: 890
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  - id: analysis-backends-detail
    name: analysis-backends-detail
    uri: /api/v1/analysis/backends/*
    priority: 885
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  # ------------------------------------------------------------------
  # Assistant-service — analysis submit (SSE).
  #
  # SSE route contract (gateway.md §6.3 + §5.3.4):
  #   * `timeout.read = 900` (15 min baseline; ≤ 30 min hard cap per
  #     §6.3) — this read timeout is ALSO the upper bound for the
  #     "user logged out but in-flight SSE still alive" window
  #     (§5.3.4); `invalidate_session` does NOT kill in-flight SSE,
  #     so the read_timeout doubles as the security collapse window.
  #     Raising this value requires re-evaluating §5.3.4 — not a
  #     single-PR change.
  #   * `proxy-control.request_buffering = false` — disable nginx
  #     request body buffering. Strictly speaking SSE submit body is
  #     small (a JSON question), but we set it for documented intent
  #     so future "long upload then SSE" patterns inherit the right
  #     baseline.
  #   * Response-side `proxy_buffering` is disabled per-response by
  #     the upstream sending `X-Accel-Buffering: no`
  #     (services/assistant-service/app/api/analysis.py). We rely on
  #     the upstream-driven signal rather than route-level config
  #     because APISIX standalone YAML doesn't expose
  #     `proxy_buffering off` as a first-class field; the upstream
  #     header is the canonical nginx mechanism.
  # check-contracts.py `sse-routes-explicit-timeout-and-buffering`
  # enforces these as machine assertions.
  # ------------------------------------------------------------------
  - id: analysis-submit
    name: analysis-submit
    uri: /api/v1/analysis
    methods: [POST, OPTIONS]
    priority: 880
    timeout:
      connect: 5
      send: 60
      read: 900
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
      proxy-control:
        request_buffering: false
    upstream_id: assistant-service

  # ------------------------------------------------------------------
  # Assistant-service — analysis detail (non-SSE GET; default timeouts)
  # ------------------------------------------------------------------

  - id: analysis-detail
    name: analysis-detail
    uri: /api/v1/analysis/*
    priority: 870
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  # ------------------------------------------------------------------
  # Assistant-service — conversations
  # ------------------------------------------------------------------
  - id: conversations-root
    name: conversations-root
    uri: /api/v1/conversations
    methods: [GET, POST, OPTIONS]
    priority: 860
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  - id: conversations-detail
    name: conversations-detail
    uri: /api/v1/conversations/*
    priority: 850
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  # ------------------------------------------------------------------
  # Assistant-service — semantic layer
  # ------------------------------------------------------------------
  - id: semantic-protected
    name: semantic-protected
    uri: /api/v1/semantic/*
    priority: 840
    plugins:
      gateway-auth:
        require_auth: true
        csrf_protect: true
        introspection_url: http://auth-service:8081/api/internal/auth/introspect
        positive_cache_ttl: 5
        negative_cache_ttl: 5
        introspect_timeout_ms: 800
        introspect_total_budget_ms: 1500
    upstream_id: assistant-service

  # ------------------------------------------------------------------
  # Frontend catch-all. MUST stay at priority=1 (gateway.md §6.2).
  # Any route above this will be matched first; this only fires when
  # no /api/v1/** or /gateway/** prefix matched.
  # ------------------------------------------------------------------
  - id: frontend
    name: frontend
    uri: /*
    priority: 1
    upstream_id: frontend

upstreams:
  - id: auth-service
    name: auth-service
    type: roundrobin
    nodes:
      "auth-service:8081": 1

  - id: assistant-service
    name: assistant-service
    type: roundrobin
    nodes:
      "assistant-service:8090": 1

  - id: frontend
    name: frontend
    type: roundrobin
    nodes:
      "frontend:80": 1

# Global rules apply to every matching request regardless of route.
# Security headers are injected here (gateway.md §6.6).
# X-Request-Id is generated by the request-id plugin and echoed back
# to the client for tracing.
global_rules:
  - id: security-headers
    plugins:
      response-rewrite:
        headers:
          set:
            X-Frame-Options: DENY
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
            # Production CSP baseline. The development CSP profile (ws:
            # / unsafe-eval for Vite HMR) is a documented future
            # addition via template fragments; see gateway.md §6.6.
            Content-Security-Policy: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
            # HSTS is commented out until TLS termination lands at the
            # gateway. Enabling it before HTTPS is available in the
            # deployment would brick the site per browser cache; see
            # gateway.md §6.6 runtime note.
            # Strict-Transport-Security: "max-age=31536000; includeSubDomains"

  - id: request-id
    plugins:
      request-id:
        include_in_response: true
        header_name: X-Request-Id

#END
