version: v1.3.0

dsn: ${DSN}

serve:
  public:
    base_url: ${KRATOS_PUBLIC_BASE_URL}
    cors:
      enabled: true
      allowed_origins:
        - ${KRATOS_PUBLIC_BASE_URL}
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
        - X-CSRF-Token
        - X-Request-Id
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: ${KRATOS_PUBLIC_BASE_URL}/home
  allowed_return_urls:
    - ${KRATOS_PUBLIC_BASE_URL}
    - ${KRATOS_PUBLIC_BASE_URL}/home
    - ${KRATOS_PUBLIC_BASE_URL}/login
    - ${KRATOS_PUBLIC_BASE_URL}/register

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/error
    login:
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/login
      lifespan: 10m
    registration:
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session
    settings:
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: false
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/recovery
    verification:
      enabled: false
      ui_url: ${KRATOS_PUBLIC_BASE_URL}/ui/verification
    logout:
      after:
        default_browser_return_url: ${KRATOS_PUBLIC_BASE_URL}/login

session:
  cookie:
    name: ory_kratos_session
    same_site: Lax
    path: /
  lifespan: 720h
  whoami:
    required_aal: aal1

secrets:
  cookie:
    - ${KRATOS_SECRET_COOKIE}
  default:
    - ${KRATOS_SECRET_DEFAULT}

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

log:
  level: info
  format: text
  leak_sensitive_values: false
