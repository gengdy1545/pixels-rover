name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Frontend: lint, test, build
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Task 4: the committed `frontend/src/shared/types/generated/
      # assistant.d.ts` MUST be a byte-identical projection of the
      # committed `services/assistant-service/openapi.json` snapshot
      # (which in turn is guarded by the `contracts` job below via
      # `assistant-openapi-snapshot-fresh`). Re-run `gen:types` and
      # fail if git detects a diff — same contract enforced by
      # `scripts/check-contracts.py::frontend-generated-types-fresh`,
      # duplicated here so the frontend job surfaces the issue on a
      # PR that only touches `frontend/` and otherwise skips the
      # `contracts` job by path filter.
      - name: Check generated TS types are fresh
        run: |
          npm run gen:types
          git diff --exit-code -- src/shared/types/generated/assistant.d.ts

  # ---------------------------------------------------------------
  # Python assistant-service: test
  # ---------------------------------------------------------------
  python-test:
    name: Python Assistant Service (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assistant-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/assistant-service/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

  # ---------------------------------------------------------------
  # Cross-layer contract drift detector (todolist §15.2).
  # Runs scripts/check-contracts.py, which mechanically enforces:
  #   * gateway/error-codes.json is the single source of truth for
  #     GATEWAY_* / INTERNAL_* error codes, and every consumer (Lua
  #     plugins, frontend InfraErrorCode union, backend.md §6.3.1
  #     rendered view) stays in sync;
  #   * gateway/apisix.yaml protected route shape goes through
  #     gateway-csrf and Oathkeeper;
  #   * gateway-ready probes[] and the internal locations in
  #     config.yaml.template's http_server_configuration_snippet
  #     stay in agreement (gateway.md §4.1).
  # Any failure here blocks merge — the script exits non-zero on
  # any drift and its stdout already identifies the offending file.
  # ---------------------------------------------------------------
  contracts:
    name: Cross-layer contracts (check-contracts.py)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Task 4: the `assistant-openapi-snapshot-fresh` and
      # `frontend-generated-types-fresh` contract checks shell out to
      # (a) `scripts/export-openapi.py` which imports the
      # assistant-service FastAPI app, and (b) `openapi-typescript`
      # which is a frontend devDependency. Both toolchains must be
      # installed before `check-contracts.py` runs, otherwise the
      # relevant checks fail with an actionable-but-irrelevant
      # "fastapi not importable" / "node_modules missing" message.
      - name: Install assistant-service runtime deps (for OpenAPI export)
        working-directory: services/assistant-service
        run: pip install -e ".[dev]"

      - name: Install frontend deps (for openapi-typescript)
        working-directory: frontend
        run: npm ci

      - name: Install contract-check runtime deps
        run: pip install pyyaml jsonschema

      - name: Run contract drift detector
        env:
          # Point the `_resolve_assistant_python()` helper in
          # check-contracts.py at the interpreter where we just
          # installed fastapi, regardless of where setup-python put it.
          ROVER_ASSISTANT_PYTHON: python3
        run: python3 scripts/check-contracts.py

  # ---------------------------------------------------------------
  # Contract-layer smoke test (todolist §15.1).
  # Boots the full stack via docker compose (dev overlay supplies
  # throw-away Ory secrets), waits on /gateway/ready, and asserts:
  #   * /api/internal/* and /gateway/internal/* are externally 404
  #     (no route declared — prevents leakage regression);
  #   * retired /api/v1/auth/* routes return 410;
  #   * legacy /api/v1/{chat,query,metadata}/* return 404;
  #   * gateway global response-rewrite injects X-Request-Id on
  #     both happy-path and 404 responses;
  #   * Oathkeeper rejects unauthenticated requests and gateway-csrf
  #     rejects unsafe requests without CSRF.
  # This is the only CI stage that exercises the full data plane,
  # so it runs last and blocks merge on failure.
  # ---------------------------------------------------------------
  smoke:
    name: Contract smoke (scripts/smoke.sh)
    runs-on: ubuntu-latest
    needs: [contracts]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run scripts/smoke.sh
        env:
          # Port 80 would need root on GitHub runners; 9080 matches
          # the APISIX default and is free on ubuntu-latest.
          GATEWAY_PORT: "9080"
          SMOKE_GATEWAY_PORT: "9080"
          # The runner's MySQL (if any) is not bound on 13306, so
          # this avoids the "port already in use" path.
          MYSQL_PORT: "13306"
          # Budget generously: cold docker build + Kratos/Alembic
          # bootstrap can take several minutes on a
          # fresh runner.
          SMOKE_READY_TIMEOUT_SEC: "480"
        run: bash scripts/smoke.sh
