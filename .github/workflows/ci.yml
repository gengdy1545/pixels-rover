name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Frontend: lint, test, build
  # ---------------------------------------------------------------
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------
  # Java auth-service: compile + unit tests
  # ---------------------------------------------------------------
  java-test:
    name: Java Auth Service (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Run only pure unit tests that do not require Spring context or DB.
      # Tests using @WebMvcTest / @SpringBootTest are excluded because the
      # parent POM (io.pixelsdb:pixels) is not available in public Maven repos.
      - name: Run unit tests
        run: >
          mvn test -B
          -pl .
          -Dtest="JwtTokenProviderTest,SysLoginServiceImplTest,AuthSessionServiceImplTest,UserServiceImplTest"
          -DfailIfNoTests=false
        continue-on-error: false

  # ---------------------------------------------------------------
  # Python analysis-service: test
  # ---------------------------------------------------------------
  python-test:
    name: Python Analysis Service (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analysis-service/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

  # ---------------------------------------------------------------
  # Cross-layer contract drift detector (todolist §15.2).
  # Runs scripts/check-contracts.py, which mechanically enforces:
  #   * gateway/error-codes.json is the single source of truth for
  #     GATEWAY_* / INTERNAL_* error codes, and every consumer (Lua
  #     plugins, frontend InfraErrorCode union, backend.md §6.3.1
  #     rendered view) stays in sync;
  #   * gateway/apisix.yaml route declarations carry the required
  #     gateway-auth fields and respect priority / namespace rules;
  #   * lua_shared_dict declarations meet the sizing and access
  #     contract (gateway.md §5.3.2);
  #   * gateway-ready probes[] and the internal locations in
  #     config.yaml.template's http_server_configuration_snippet
  #     stay in agreement (gateway.md §4.1).
  # Any failure here blocks merge — the script exits non-zero on
  # any drift and its stdout already identifies the offending file.
  # ---------------------------------------------------------------
  contracts:
    name: Cross-layer contracts (check-contracts.py)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: pip install pyyaml

      - name: Run contract drift detector
        run: python3 scripts/check-contracts.py

  # ---------------------------------------------------------------
  # Contract-layer smoke test (todolist §15.1).
  # Boots the full stack via docker compose (dev overlay supplies
  # throw-away dev secrets + jwt-keygen init container so CI doesn't
  # need real keys), waits on /gateway/ready, and asserts:
  #   * /api/internal/* and /gateway/internal/* are externally 404
  #     (no route declared — prevents leakage regression);
  #   * /api/v1/{auth,analysis}/openapi.json reachable + parseable,
  #     and their GATEWAY_*/INTERNAL_* errorCode enum values are a
  #     subset of gateway/error-codes.json keys (C4 assertion tail);
  #   * legacy /api/v1/{chat,query,metadata}/* return 404;
  #   * gateway global response-rewrite injects X-Request-Id on
  #     both happy-path and 404 responses;
  #   * register -> login -> gateway-auth -> auth introspect ->
  #     X-Auth-* injection chain returns a proper envelope.
  # This is the only CI stage that exercises the full data plane,
  # so it runs last and blocks merge on failure.
  # ---------------------------------------------------------------
  smoke:
    name: Contract smoke (scripts/smoke.sh)
    runs-on: ubuntu-latest
    needs: [contracts]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies (jq)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run scripts/smoke.sh
        env:
          # Port 80 would need root on GitHub runners; 9080 matches
          # the APISIX default and is free on ubuntu-latest.
          GATEWAY_PORT: "9080"
          SMOKE_GATEWAY_PORT: "9080"
          # The runner's MySQL (if any) is not bound on 13306, so
          # this avoids the "port already in use" path.
          MYSQL_PORT: "13306"
          # Budget generously: cold docker build + Flyway/Alembic
          # bootstrap + jwt-keygen can take ~3-4 minutes on a
          # fresh runner.
          SMOKE_READY_TIMEOUT_SEC: "480"
        run: bash scripts/smoke.sh
