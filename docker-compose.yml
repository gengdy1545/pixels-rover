# Pixels Rover — Docker Compose baseline
#
# All external traffic enters through APISIX on GATEWAY_PORT. APISIX keeps
# routing, static assets, CORS/CSP/security headers, and /gateway/live|ready.
# Identity is owned by Ory Kratos; protected API access is mediated by the
# APISIX gateway-csrf plugin plus Ory Oathkeeper before requests reach backend services.

x-kratos-environment: &kratos-environment
  DSN: "mysql://pixels:${MYSQL_PASSWORD:-password}@tcp(mysql:3306)/pixels_kratos?parseTime=true&multiStatements=true"
  SERVE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  SERVE_PUBLIC_CORS_ALLOWED_ORIGINS_0: ${PUBLIC_BASE_URL:-}
  SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${PUBLIC_BASE_URL:-}/home
  SELFSERVICE_ALLOWED_RETURN_URLS_0: ${PUBLIC_BASE_URL:-}
  SELFSERVICE_ALLOWED_RETURN_URLS_1: ${PUBLIC_BASE_URL:-}/home
  SELFSERVICE_ALLOWED_RETURN_URLS_2: ${PUBLIC_BASE_URL:-}/login
  SELFSERVICE_ALLOWED_RETURN_URLS_3: ${PUBLIC_BASE_URL:-}/register
  SELFSERVICE_FLOWS_ERROR_UI_URL: ${PUBLIC_BASE_URL:-}/ui/error
  SELFSERVICE_FLOWS_LOGIN_UI_URL: ${PUBLIC_BASE_URL:-}/ui/login
  SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${PUBLIC_BASE_URL:-}/ui/registration
  SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${PUBLIC_BASE_URL:-}/ui/settings
  SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${PUBLIC_BASE_URL:-}/ui/recovery
  SELFSERVICE_FLOWS_VERIFICATION_UI_URL: ${PUBLIC_BASE_URL:-}/ui/verification
  SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${PUBLIC_BASE_URL:-}/login
  SECRETS_DEFAULT_0: ${KRATOS_SECRET_DEFAULT:-}
  SECRETS_COOKIE_0: ${KRATOS_SECRET_COOKIE:-}

services:
  mysql:
    image: mysql:8.0
    container_name: pixels-rover-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: pixels
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/pixels_rover.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  required-env-guard:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pixels-rover-required-env-guard
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        python3 /usr/local/apisix/conf/validate-required-env.py --yaml /usr/local/apisix/conf/required-env.yaml --service ory-deployment
        python3 /usr/local/apisix/conf/validate-required-env.py --yaml /usr/local/apisix/conf/required-env.yaml --service kratos
        python3 /usr/local/apisix/conf/validate-required-env.py --yaml /usr/local/apisix/conf/required-env.yaml --service ory-ui
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      KRATOS_SECRET_DEFAULT: ${KRATOS_SECRET_DEFAULT:-}
      KRATOS_SECRET_COOKIE: ${KRATOS_SECRET_COOKIE:-}
      ORY_UI_COOKIE_SECRET: ${ORY_UI_COOKIE_SECRET:-}
    volumes:
      - ./config/required-env.yaml:/usr/local/apisix/conf/required-env.yaml:ro

  kratos-migrate:
    image: ${KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    container_name: pixels-rover-kratos-migrate
    depends_on:
      required-env-guard:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    environment: *kratos-environment
    volumes:
      - ./config/ory/kratos:/etc/config/kratos:ro
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]
    restart: "no"

  kratos:
    image: ${KRATOS_IMAGE:-oryd/kratos:v26.2.0}
    container_name: pixels-rover-kratos
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment: *kratos-environment
    expose:
      - "4433"
      - "4434"
    volumes:
      - ./config/ory/kratos:/etc/config/kratos:ro
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml"]
    healthcheck:
      test: ["CMD", "kratos", "health", "ready", "--endpoint", "http://localhost:4434"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  oathkeeper:
    image: ${OATHKEEPER_IMAGE:-oryd/oathkeeper:v26.2.0}
    container_name: pixels-rover-oathkeeper
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
    expose:
      - "4455"
      - "4456"
    volumes:
      - ./config/ory/oathkeeper:/etc/config/oathkeeper:ro
    command: ["serve", "--config", "/etc/config/oathkeeper/oathkeeper.yml"]
    healthcheck:
      test: ["CMD", "oathkeeper", "health", "ready", "--endpoint", "http://localhost:4456"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  ory-ui:
    image: ${ORY_UI_IMAGE:-oryd/kratos-selfservice-ui-node:v26.2.0}
    container_name: pixels-rover-ory-ui
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      PORT: 4455
      BASE_PATH: /ui
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_BROWSER_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECRET: ${ORY_UI_COOKIE_SECRET:-}
      CSRF_COOKIE_NAME: pixels_rover_ui_csrf
      CSRF_COOKIE_SECRET: ${ORY_UI_COOKIE_SECRET:-}
      DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES: ${ORY_UI_DISABLE_SECURE_CSRF_COOKIES:-false}
    expose:
      - "4455"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4455/ui/login').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10

  assistant-service:
    build:
      context: ./services/assistant-service
      dockerfile: Dockerfile
    container_name: pixels-rover-assistant
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ROVER_LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ROVER_LLM_API_KEY: ${ROVER_LLM_API_KEY:-}
      ROVER_LLM_API_BASE: ${LLM_API_BASE:-}
      ROVER_DATABASE_URL: ${ROVER_DATABASE_URL:-}
      ROVER_DUCKDB_PATH: ${ROVER_DUCKDB_PATH:-/var/lib/pixels-rover/duckdb/analysis.duckdb}
      ROVER_PIXELS_HOST: ${PIXELS_HOST:-host.docker.internal}
      ROVER_PIXELS_PORT: ${PIXELS_PORT:-18890}
      ROVER_DEBUG: ${ROVER_DEBUG:-false}
      # architecture-tasks §Task 8 — Oathkeeper id_token verifier.
      # Every non-test runtime MUST set OATHKEEPER_JWT_REQUIRED=true
      # (the required-env validator refuses to boot otherwise). The
      # three supporting vars are also required-env declared; the
      # compose default here is empty so missing values fail fast
      # through the validator rather than silently disabling
      # verification.
      OATHKEEPER_JWKS_URL: ${OATHKEEPER_JWKS_URL:-http://oathkeeper:4456/.well-known/jwks.json}
      OATHKEEPER_JWT_ISSUER: ${OATHKEEPER_JWT_ISSUER:-}
      OATHKEEPER_JWT_AUDIENCE: ${OATHKEEPER_JWT_AUDIENCE:-}
      OATHKEEPER_JWT_REQUIRED: ${OATHKEEPER_JWT_REQUIRED:-}
    expose:
      - "8090"
    volumes:
      - ./config/required-env.yaml:/app/config/required-env.yaml:ro
      - assistant-duckdb:/var/lib/pixels-rover/duckdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixels-rover-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pixels-rover-gateway
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      oathkeeper:
        condition: service_healthy
      ory-ui:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:9080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GATEWAY_CSP_PROFILE: ${GATEWAY_CSP_PROFILE:-}
    volumes:
      - ./gateway/apisix.yaml.template:/usr/local/apisix/conf/apisix.yaml.template:ro
      - ./config/required-env.yaml:/usr/local/apisix/conf/required-env.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/gateway/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  mysql-data:
    driver: local
  assistant-duckdb:
    driver: local
