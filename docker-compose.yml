# Pixels Rover — Docker Compose
#
# Usage:
#   docker compose up              Start all services
#   docker compose up -d           Start in background
#   docker compose up mysql        Start MySQL only
#   docker compose down            Stop all services
#   docker compose logs -f         Follow logs
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in required values
#   2. Run: docker compose up
#
# Architecture:
#   All traffic enters through the API Gateway (port 80/443).
#   The gateway handles routing, JWT auth passthrough, rate limiting,
#   CORS, and audit logging. Backend services are not directly exposed.
#
# Ports (external):
#   - 80    API Gateway (unified entry point)
#   - 3306  MySQL (optional, for direct DB access)

services:
  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: pixels-rover-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: pixels_rover
      MYSQL_USER: pixels
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/pixels_rover.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------- JWT Key Generator (init container) ----------
  jwt-keygen:
    image: alpine:3.20
    container_name: pixels-rover-jwt-keygen
    volumes:
      - jwt-keys:/keys
      - ./scripts/generate-jwt-rsa-keys.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "/generate.sh", "/keys", "${JWT_KID:-dev-rsa-1}"]
    restart: "no"

  # ---------- Auth Service (Java / Spring Boot) ----------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: pixels-rover-auth
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      jwt-keygen:
        condition: service_completed_successfully
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pixels_rover
      SPRING_DATASOURCE_USERNAME: pixels
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-password}
      # JWT (RS256)
      JWT_ALGORITHM: RS256
      JWT_ACTIVE_KID: ${JWT_KID:-dev-rsa-1}
      JWT_PRIVATE_KEY_PATH: /jwt-keys/${JWT_KID:-dev-rsa-1}-private.pem
      JWT_PUBLIC_KEY_PATH: /jwt-keys/${JWT_KID:-dev-rsa-1}-public.pem
      JWT_PUBLIC_KEYS_PATH: /jwt-keys/${JWT_KID:-dev-rsa-1}-public-keys.json
      # Server
      SERVER_PORT: 8081
    # No external port exposure — only reachable via gateway
    expose:
      - "8081"
    volumes:
      - jwt-keys:/jwt-keys:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ---------- Analysis Service (Python / FastAPI) ----------
  analysis-service:
    build:
      context: ./services/analysis-service
      dockerfile: Dockerfile
    container_name: pixels-rover-analysis
    restart: unless-stopped
    depends_on:
      jwt-keygen:
        condition: service_completed_successfully
    environment:
      # LLM
      ROVER_LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ROVER_LLM_API_KEY: ${LLM_API_KEY:-}
      ROVER_LLM_API_BASE: ${LLM_API_BASE:-}
      # Database
      ROVER_DATABASE_URL: sqlite+aiosqlite:///./rover.db
      # DuckDB
      ROVER_DUCKDB_PATH: ":memory:"
      # Pixels Server
      ROVER_PIXELS_HOST: ${PIXELS_HOST:-host.docker.internal}
      ROVER_PIXELS_PORT: ${PIXELS_PORT:-18890}
      # JWT (RS256)
      ROVER_JWT_ALGORITHM: RS256
      ROVER_JWT_ACTIVE_KID: ${JWT_KID:-dev-rsa-1}
      ROVER_JWT_PUBLIC_KEY_PATH: /jwt-keys/${JWT_KID:-dev-rsa-1}-public.pem
      ROVER_JWT_PUBLIC_KEYS_PATH: /jwt-keys/${JWT_KID:-dev-rsa-1}-public-keys.json
      ROVER_JWT_ISSUER: pixels-rover-auth-service
      # Debug
      ROVER_DEBUG: ${DEBUG:-false}
    # No external port exposure — only reachable via gateway
    expose:
      - "8090"
    volumes:
      - jwt-keys:/jwt-keys:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------- Frontend (nginx — static assets only) ----------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: pixels-rover-frontend
    restart: unless-stopped
    # No external port exposure — served via gateway
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------- API Gateway (nginx — unified entry point) ----------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: pixels-rover-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"
    environment:
      # Cookie configuration (injected into nginx via env)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ACCESS_TOKEN_MAX_AGE: ${ACCESS_TOKEN_MAX_AGE:-3600}
      REFRESH_TOKEN_MAX_AGE: ${REFRESH_TOKEN_MAX_AGE:-604800}
      # CORS allowed origins (comma-separated, '*' for dev)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Pixels Server upstream (for metadata/query proxy)
      PIXELS_SERVER_UPSTREAM: http://${PIXELS_HOST:-host.docker.internal}:${PIXELS_PORT:-18890}
      # Text2SQL service upstream
      TEXT2SQL_UPSTREAM: ${TEXT2SQL_URL:-http://host.docker.internal/text2sql}
    volumes:
      - gateway-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/gateway/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mysql-data:
    driver: local
  jwt-keys:
    driver: local
  gateway-logs:
    driver: local
